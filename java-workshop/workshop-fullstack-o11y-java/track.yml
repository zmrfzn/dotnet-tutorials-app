title: DevRel Workshop - Introduction on Full Stack Observability with New Relic on
  Java
teaser: Instrument a Full Stack application with New Relic for end to end observability
description: |-
  ## Objectives
  This workshop is a great hands-on introduction to the world of observability with New Relic.
  In this Full Stack Observability workshop, we will take a comprehensive approach to explore a modern Java stack. We will use Spring Boot, PostgreSQL, and React to implement observability practices that allow engineers to monitor and analyze application behavior in real-time, ensuring they always perform at their best. Observability practices involve collecting and analyzing data such as logs, metrics, and traces which helps diagnose issues that may impact the application's performance.

  ## What You'll Learn
  - Instrument a Java Spring Boot API application with New Relic APM for application performance monitoring.
  - Set up New Relic Infrastructure agent to monitor the underlying Linux host and system resources.
  - Configure custom log forwarding and monitoring for application logs in New Relic.
  - Instrument and monitor a PostgreSQL database with New Relic Infrastructure agent.
  - Set up New Relic Browser monitoring to track frontend React application performance.
  - Enhance your telemetry data with custom instrumentation in both Java backend and React frontend.
  - Set up New Relic Synthetics to monitor uptime and health for web applications.
  - Bonus: Use New Relic Flex for agentless instrumentation and custom metrics collection.

  ## Tech Stack
  - **Backend**: Java Spring Boot 3.4 with Spring Data JPA
  - **Database**: PostgreSQL with tutorials and categories data
  - **Frontend**: React application with Vite build system
  - **Infrastructure**: Ubuntu Linux VM with New Relic monitoring agents

  ## Requirements
  * A free [New Relic account](https://newrelic.com/signup?utm_source=instruqt-labs).

  ## Important Note
  This track utilizes an ephemeral virtual machine, which means that you will lose any progress you've made if you don't complete the workshop within a period of time. We strongly encourage you to finish the workshop in one sitting!


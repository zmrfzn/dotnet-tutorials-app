version: "3"
virtualmachines:
- name: fullstack-o11y-dotnet
  image: devrel-instruqt-images/devrel-base-um
  shell: /bin/bash
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    NODE_ENV: development
  machine_type: e2-standard-4
  allow_external_ingress:
  - http
  - https
  - high-ports
  provision_ssl_certificate: true
